<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Flip Login & Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage-container">
    <div class="flip-card-wrapper" id="flipWrapper">
      <div class="card-inner" id="cardInner">
        
        <!-- FRONT FACE: Sign In -->
        <div class="card-face card-front">
          <div class="card-top">
            <div class="icon-circle">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <h2>Member Access</h2>
            <p>Enter your workspace credentials</p>
          </div>

          <form id="signInForm" class="auth-form" novalidate>
            <div class="input-block">
              <label for="loginEmail">Email Address</label>
              <input type="email" id="loginEmail" placeholder="user@domain.com" required>
            </div>

            <div class="input-block">
              <div class="label-split">
                <label for="loginPassword">Password</label>
                <a href="#" class="accent-link">Reset key?</a>
              </div>
              <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="action-btn primary-btn">
              <span>Enter Portal</span>
            </button>
          </form>

          <div class="card-bottom">
            <span>New here?</span>
            <button type="button" class="switch-link" id="flipToRegister">Create your account &rarr;</button>
          </div>
        </div>

        <!-- BACK FACE: Sign Up -->
        <div class="card-face card-back">
          <div class="card-top">
            <div class="icon-circle register-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="8.5" cy="7" r="4"/>
                <line x1="20" y1="8" x2="20" y2="14"/>
                <line x1="23" y1="11" x2="17" y2="11"/>
              </svg>
            </div>
            <h2>Create Profile</h2>
            <p>Setup a brand new account in seconds</p>
          </div>

          <form id="registerForm" class="auth-form" novalidate>
            <div class="input-block">
              <label for="regName">Full Legal Name</label>
              <input type="text" id="regName" placeholder="Alex Morgan" required>
            </div>

            <div class="input-block">
              <label for="regEmail">Corporate Email</label>
              <input type="email" id="regEmail" placeholder="alex@domain.com" required>
            </div>

            <div class="input-block">
              <label for="regPassword">Security Password</label>
              <input type="password" id="regPassword" placeholder="Create strong passphrase" required>
            </div>

            <button type="submit" class="action-btn register-btn">
              <span>Initialize Account</span>
            </button>
          </form>

          <div class="card-bottom">
            <span>Already registered?</span>
            <button type="button" class="switch-link" id="flipToLogin">&larr; Return to login</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="flipToast" class="toast-popup"></div>
  <script src="script.js"></script>
</body>
</html>
