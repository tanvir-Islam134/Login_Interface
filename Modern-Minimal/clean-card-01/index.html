<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Minimalist Login Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <div class="auth-card">
      <!-- Brand Logo / Icon -->
      <div class="auth-header">
        <div class="logo-box">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <rect width="24" height="24" rx="6" fill="#0F172A"/>
            <path d="M7 12L10.5 15.5L17 9" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="auth-title">Sign in to your account</h1>
        <p class="auth-subtitle">Welcome back! Please enter your details.</p>
      </div>

      <!-- Social Logins -->
      <div class="social-grid">
        <button type="button" class="social-pill-btn">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.7 0 3 .6 4 1.5l3-3C17.2 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.1s.7 5.4 1.9 7.8l3.7-2.9z"/>
            <path fill="#34A853" d="M12 23.2c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.6C3.7 20.3 7.5 23.2 12 23.2z"/>
          </svg>
          <span>Google</span>
        </button>
        <button type="button" class="social-pill-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#0F172A">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <span>GitHub</span>
        </button>
      </div>

      <div class="separator">
        <span>or with email</span>
      </div>

      <!-- Auth Form -->
      <form id="minimalLoginForm" class="auth-form" novalidate>
        <div class="form-field">
          <label for="minEmail">Email address</label>
          <input type="email" id="minEmail" placeholder="you@company.com" required autocomplete="email">
          <span class="field-error" id="minEmailError"></span>
        </div>

        <div class="form-field">
          <div class="field-header">
            <label for="minPassword">Password</label>
            <a href="#" class="inline-link">Forgot password?</a>
          </div>
          <div class="password-box">
            <input type="password" id="minPassword" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="eye-toggle" id="minTogglePass" aria-label="Toggle password view">
              <svg id="minEyeSvg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="minPassError"></span>
        </div>

        <div class="form-row">
          <label class="remember-box">
            <input type="checkbox" id="minRemember">
            <span class="box-indicator"></span>
            <span class="box-text">Remember this device</span>
          </label>
        </div>

        <button type="submit" class="primary-button" id="minSubmitBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner" style="display: none;"></span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="#" class="inline-link bold">Sign up for free</a>
      </div>
    </div>
  </div>

  <div id="minToast" class="mini-toast"></div>
  <script src="script.js"></script>
</body>
</html>
